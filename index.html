<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom smooth transition for counter number */
        .count-animate {
            transition: transform 0.15s ease-out, opacity 0.15s ease-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-sm bg-slate-800/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl border border-slate-700/50 flex flex-col items-center justify-center space-y-8">
        
        <!-- App Title -->
        <header class="text-center">
            <h1 class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Counter App</h1>
        </header>

        <!-- Display Area -->
        <div class="relative flex items-center justify-center h-32 w-full">
            <span id="counter-value" class="text-7xl font-bold tracking-tight text-white select-none count-animate">
                0
            </span>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-4 w-full">
            <!-- Decrement Button -->
            <button 
                id="btn-decrement" 
                aria-label="Decrement count"
                class="flex-1 py-4 bg-slate-700 hover:bg-slate-600 active:scale-95 text-2xl font-bold rounded-2xl transition-all duration-200 shadow-md flex items-center justify-center text-slate-200 hover:text-white select-none focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
            >
                −
            </button>

            <!-- Reset Button -->
            <button 
                id="btn-reset" 
                aria-label="Reset count"
                class="p-4 bg-slate-700/50 hover:bg-slate-700 active:scale-95 text-xs font-semibold uppercase tracking-wider text-slate-400 hover:text-slate-200 rounded-2xl transition-all duration-200 shadow-md select-none focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
            >
                Reset
            </button>

            <!-- Increment Button -->
            <button 
                id="btn-increment" 
                aria-label="Increment count"
                class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-2xl font-bold rounded-2xl transition-all duration-200 shadow-md shadow-indigo-600/30 flex items-center justify-center text-white select-none focus:outline-none focus:ring-2 focus:ring-indigo-400"
            >
                +
            </button>
        </div>

    </main>

    <script>
        // State
        let count = 0;

        // DOM Elements
        const counterEl = document.getElementById('counter-value');
        const incrementBtn = document.getElementById('btn-increment');
        const decrementBtn = document.getElementById('btn-decrement');
        const resetBtn = document.getElementById('btn-reset');

        // Update UI Function
        function updateCounter(scaleFactor = 1) {
            // Apply scale animation trigger
            counterEl.style.transform = `scale(${scaleFactor})`;
            counterEl.textContent = count;

            // Reset scale after animation
            setTimeout(() => {
                counterEl.style.transform = 'scale(1)';
            }, 100);
        }

        // Event Listeners
        incrementBtn.addEventListener('click', () => {
            count++;
            updateCounter(1.15);
        });

        decrementBtn.addEventListener('click', () => {
            count--;
            updateCounter(0.85);
        });

        resetBtn.addEventListener('click', () => {
            if (count === 0) return;
            count = 0;
            updateCounter(0.9);
        });

        // Keyboard Support (ArrowUp / ArrowDown)
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowUp' || event.key === '+') {
                count++;
                updateCounter(1.15);
            } else if (event.key === 'ArrowDown' || event.key === '-') {
                count--;
                updateCounter(0.85);
            } else if (event.key === 'r' || event.key === 'R') {
                count = 0;
                updateCounter(0.9);
            }
        });
    </script>
</body>
</html>
